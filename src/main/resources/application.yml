server:
  tomcat:
    # Giữ keep-alive 5 phút để client (Postman/tool) tái sử dụng connection an toàn;
    # mặc định 20s khiến request gửi sau khi idle bị ECONNRESET trên Windows.
    keep-alive-timeout: 5m

spring:
  application:
    name: english_app_cdcntt
  mail:
    # Brevo SMTP. Verify one sender address in Brevo first; when a domain is verified, only
    # MAIL_FROM has to change.
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 30m
    refresh-token-expiration: 7d
  ai:
    base-url: ${AI_BASE_URL}
    api-key: ${AI_API_KEY}
    model: ${AI_MODEL}
    connect-timeout: 60s
    read-timeout: 60s
  cleanup:
    enabled: true
    cron: "0 0 3 * * *"
    zone: UTC
  mail:
    from: ${MAIL_FROM}
  otp:
    registration-ttl: 10m
    reset-ttl: 15m
    resend-cooldown: 60s
    send-window: 1h
    max-sends-per-window: 5
    max-attempts: 5
  ip-rate-limit:
    # Chặn một máy gọi dồn hai endpoint công khai; quota thật vẫn là send_count theo email.
    enabled: true
    max-requests: 30
    window: 1h

logging:
  level:
    com.example.english_app_cdcntt: INFO

